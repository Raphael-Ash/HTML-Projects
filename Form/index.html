<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form-Projects</title>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>Personal Details</legend>
        <form action="#">
          <label>Name: </label>
          <input type="text" placeholder="Enter your name" />
          <br />
          <label>Address: </label>
          <input type="text" placeholder="Enter your address" />
          <br />
          <label>Email: </label>
          <input type="email" placeholder="Enter your email" />
          <br />
          <label>Phone Number: </label>
          <input type="text" placeholder="Enter your number" />
          <br />
          <label>ID: </label>
          <input type="text" placeholder="Enter your ID" />
          <br />
          <label>Gender: </label>
          <br />
          <input type="radio" />
          <label>Male</label>
          <br />
          <input type="radio" />
          <label>Female</label>
          <br />
          <input type="radio" />
          <label>Other</label>
          <br />
          <label>Date of Proposed outing: </label>
          <input type="date" placeholder="YYYY MM DD" />
        </form>
      </fieldset>

      <div>
        <h3>contact us</h3>
        <span>
          <a href="https://github.com/Raphael-Ash" target="_blank">Github</a>
          <br />
          <a
            href="https://www.linkedin.com/in/raphael-ashbourne-149638434/"
            arget="_blank"
            >linkedin</a
          >
        </span>
      </div>
    </main>
  </body>
</html>
